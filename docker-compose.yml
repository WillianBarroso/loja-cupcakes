services:
  db:
    image: postgres:15-alpine
    container_name: postgres-cupcake-docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: cupcake-app-docker
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/loja-cupcakes
      SPRING_DATASOURCE_USERNAME: loja_cupcake_user
      SPRING_DATASOURCE_PASSWORD: '123456'
    depends_on:
      - db

volumes:
  postgres_data: