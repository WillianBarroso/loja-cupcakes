<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cupcake Store</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Fontes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap"
          rel="stylesheet">
    <!-- Font Awesome icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Base da Aplicação -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header Fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 d-flex justify-content-center align-items-start flex-grow-1">
    <div class="login-card mt-4">
        <h2 class="login-title font-serif">Login</h2>

        <!-- Alerta exibido quando veio do botão "Fazer Login" do carrinho -->
        <div th:if="${redirect == 'checkout' or param.redirect == 'checkout'}"
             class="alert alert-dark-danger mb-4 d-flex align-items-center"
             role="alert">
            <i class="fa-solid fa-cart-shopping me-2"></i>
            <span>Você precisa estar logado para finalizar o seu pedido!</span>
        </div>

        <!-- Mensagem de credenciais inválidas -->
        <div th:if="${erro}"
             class="alert alert-dark-danger mb-4 d-flex align-items-center"
             role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <span th:text="${erro}">Credenciais inválidas!</span>
        </div>

        <!-- Mensagem de confirmação pós-cadastro -->
        <div th:if="${param.cadastrado}"
             class="alert alert-dark-success mb-4 d-flex align-items-center"
             role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span>Cadastro realizado com sucesso! Faça login abaixo.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" name="redirect"
                   th:value="${param.redirect != null ? param.redirect : redirect}">
            <div class="mb-3 row align-items-center">
                <label for="email"
                       class="col-sm-3 col-form-label form-label-custom">Email:</label>
                <div class="col-sm-9">
                    <input type="email" id="email" name="email"
                           class="form-control form-control-dark"
                           placeholder="seu@email.com" required autofocus>
                </div>
            </div>

            <div class="mb-4 row align-items-center">
                <label for="senha"
                       class="col-sm-3 col-form-label form-label-custom">Senha:</label>
                <div class="col-sm-9">
                    <input type="password" id="senha" name="senha"
                           class="form-control form-control-dark"
                           placeholder="••••••••" required>
                </div>
            </div>

            <!-- Botões de Ação: ENTRAR, CADASTRE-SE e VOLTAR -->
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mt-4 pt-2">
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-orange-pill">Entrar
                    </button>
                    <a th:href="@{/cadastro}" class="btn btn-outline-pill">Cadastre-se</a>
                </div>
                <a th:href="@{/carrinho}" class="btn btn-outline-pill">Voltar ao
                    Carrinho</a>
            </div>
        </form>
    </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
