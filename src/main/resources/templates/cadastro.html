<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Cupcake Store</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Fontes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap"
          rel="stylesheet">
    <!-- Font Awesome icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Base da Aplicação -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header Fragment -->
<div th:replace="~{fragments/header :: headerComponente}"></div>

<main class="container py-5 d-flex justify-content-center align-items-start flex-grow-1">
    <div class="login-card mt-4">
        <h2 class="login-title font-serif">Criar Conta</h2>

        <!-- Mensagem de erro de exceção (Ex: Email já cadastrado) -->
        <div th:if="${erro}"
             class="alert alert-dark-danger mb-4 d-flex align-items-center"
             role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <span th:text="${erro}">Erro ao realizar cadastro!</span>
        </div>

        <form th:action="@{/cadastro}" th:object="${usuarioDTO}" method="post">

            <!-- Campo Nome -->
            <div class="mb-3 row align-items-center">
                <label for="nome"
                       class="col-sm-3 col-form-label form-label-custom">Nome:</label>
                <div class="col-sm-9">
                    <input type="text" id="nome" th:field="*{nome}"
                           class="form-control form-control-dark"
                           placeholder="Seu nome completo" required autofocus>
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('nome')}"
                         th:errors="*{nome}"></div>
                </div>
            </div>

            <!-- Campo Email -->
            <div class="mb-3 row align-items-center">
                <label for="email"
                       class="col-sm-3 col-form-label form-label-custom">Email:</label>
                <div class="col-sm-9">
                    <input type="email" id="email" th:field="*{email}"
                           class="form-control form-control-dark"
                           placeholder="seu@email.com" required>
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                </div>
            </div>

            <!-- Campo Senha -->
            <div class="mb-4 row align-items-center">
                <label for="senha"
                       class="col-sm-3 col-form-label form-label-custom">Senha:</label>
                <div class="col-sm-9">
                    <input type="password" id="senha" th:field="*{senha}"
                           class="form-control form-control-dark"
                           placeholder="••••••••" required>
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('senha')}"
                         th:errors="*{senha}"></div>
                </div>
            </div>

            <!-- Botões de Ação: Cadastrar e Já tenho conta / Voltar ao Login -->
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mt-4 pt-2">
                <button type="submit" class="btn btn-orange-pill">Finalizar
                    Cadastro
                </button>
                <a th:href="@{/login}" class="btn btn-outline-pill">Já tenho
                    conta</a>
            </div>
        </form>
    </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
