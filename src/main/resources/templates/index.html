<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CupcakeStore - The Flavor Gallery</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <!-- CSS Externo -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- INCLUDE DO HEADER (Equivalente ao <?php include 'header.php'; ?>) -->
<header th:replace="~{fragments/header :: headerComponente}"></header>

<!-- Conteúdo Principal -->
<main class="container mb-5">

    <!-- Cabeçalho do Catálogo -->
    <div class="row align-items-end mb-5">
        <div class="col-md-8">
            <span class="gallery-tag font-mono">The Flavor Gallery</span>
            <h1 class="font-serif display-4 fw-normal text-light mt-1 mb-0">
                Lista de Cupcakes<span class="brand-dot">.</span></h1>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <p class="font-mono text-muted small mb-0">PRODUÇÃO ARTESANAL •
                EDICÃO LIMITADA</p>
        </div>
    </div>

    <!-- Alerta quando não houver produtos -->
    <div th:if="${#lists.isEmpty(cupcakes)}"
         class="p-5 text-center rounded-3 my-5"
         style="background-color: var(--card-bg); border: 1px solid var(--border-color);">
        <p class="text-secondary mb-0">Nenhum cupcake disponível na galeria no
            momento.</p>
    </div>

    <!-- Grid de Cards de Cupcakes -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4"
         th:if="${!#lists.isEmpty(cupcakes)}">
        <div class="col" th:each="cupcake, iterStat : ${cupcakes}">
            <div class="cupcake-card h-100 d-flex flex-column">

                <!-- Imagem + Badges embutidas -->
                <div class="card-img-wrapper">
                    <span class="badge-number font-mono"
                          th:text="${'# ' + #numbers.formatInteger(iterStat.index + 1, 3)}"># 001</span>
                    <img th:src="${cupcake.imagemUrl != null && !#strings.isEmpty(cupcake.imagemUrl) ? cupcake.imagemUrl : 'https://via.placeholder.com/300x240/121111/ff5e1a?text=Cupcake'}"
                         class="cupcake-img"
                         th:alt="${cupcake.nome}" alt="" src="#">
                    <span class="badge-price font-mono"
                          th:text="${'R$ ' + #numbers.formatDecimal(cupcake.preco, 1, 'POINT', 2, 'COMMA')}">
                            R$ 10,00
                        </span>
                </div>

                <!-- Conteúdo do Card -->
                <!-- Conteúdo do Card -->
                <div class="p-3 d-flex flex-column flex-grow-1">
                    <h5 class="font-serif fs-5 text-light mb-1"
                        th:text="${cupcake.nome}">Cupcake Chocolate</h5>

                    <!-- Descrição com classe personalizada para alta visibilidade -->
                    <p class="cupcake-description small mb-3 flex-grow-1"
                       th:text="${cupcake.descricao}">Descrição gourmet do sabor
                        do cupcake.</p>

                    <!-- Estoque Alinhado à Direita -->
                    <div class="d-flex justify-content-end text-end align-items-center mb-3">
        <span th:if="${cupcake.estoque > 0}"
              class="font-mono cupcake-stock-label"
              style="font-size: 0.75rem;">
                Estoque disponível: <span class="text-light fw-bold"
                                          th:text="${cupcake.estoque}">10</span>
        </span>
                        <span th:if="${cupcake.estoque == 0}"
                              class="font-mono text-danger fw-bold"
                              style="font-size: 0.75rem;">
                ESGOTADO
        </span>
                    </div>

                    <!-- Formulário Adicionar ao Carrinho -->
                    <form th:action="@{/carrinho/adicionar}" method="post"
                          class="mt-auto">
                        <input type="hidden" name="id"
                               th:value="${cupcake.id}"/>

                        <div th:if="${cupcake.estoque > 0}"
                             class="d-flex flex-column gap-2">
                            <!-- Controles - 1 + -->
                            <div class="qty-control d-flex align-items-center justify-content-between">
                                <button type="button" class="btn-qty"
                                        onclick="alterarQuantidade(this, -1)">-
                                </button>
                                <label>
                                    <input type="number" name="quantidade"
                                           value="1" min="1"
                                           th:max="${cupcake.estoque}"
                                           class="qty-input font-mono"
                                           readonly/>
                                </label>
                                <button type="button" class="btn-qty"
                                        onclick="alterarQuantidade(this, 1)">+
                                </button>
                            </div>

                            <button type="submit" class="btn-add-cart">
                                Adicionar ao carrinho
                            </button>
                        </div>

                        <div th:if="${cupcake.estoque == 0}">
                            <button type="button"
                                    class="btn-add-cart btn-disabled" disabled>
                                Indisponível
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Script dos Botões + / - -->
<script>
    function alterarQuantidade(btn, delta) {
        const container = btn.closest('.qty-control');
        const input = container.querySelector('input[name="quantidade"]');
        let val = parseInt(input.value) || 1;
        const min = parseInt(input.min) || 1;
        const max = parseInt(input.max) || 99;

        val += delta;
        if (val >= min && val <= max) {
            input.value = val;
        }
    }
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
